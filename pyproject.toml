[project]
name = "trm"
version = "0.1.0"
description = "Tiny Recursive Model for ARC-AGI"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "wandb>=0.16.0",
    "ipython>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
