# Small config for local testing on M4 Pro
# Use this to verify the code works before cloud training

model:
  d_model: 128
  n_heads: 4
  n_layers: 2
  n_recursions: 4
  dropout: 0.0

training:
  batch_size: 4
  epochs: 5
  lr_trunk: 1.0e-4
  lr_embed: 1.0e-2
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  supervision_weights: "uniform"
  curriculum_start_recursions: 2
  curriculum_full_recursions_epoch: 3

data:
  data_dir: "data/arc-agi-1"
  augment_factor: 2  # Minimal augmentation for testing
  num_workers: 0     # No multiprocessing for debugging

checkpoint:
  save_dir: "checkpoints/local_test"
  save_every: 1

logging:
  use_wandb: false

hardware:
  device: "mps"  # Apple Silicon
  use_amp: false
